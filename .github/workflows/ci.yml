name: ci

on:
  # main is pushed to directly here, so `pull_request` never fired.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every reference on one runner. Each of them checked out the same three
  # trees and installed the same node to run one npm script that takes seconds,
  # so a runner apiece was paying that setup over and over.
  references:
    name: the references match what they describe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the documentation
        uses: actions/checkout@v5
        with:
          path: ebpfsentinel-docs

      # The agent is the source of truth for every series this tree names, for
      # `openapi.json` generated from its route annotations, and for the proto
      # the gRPC reference describes. It is public, so the checks read it
      # directly rather than vendoring a copy that would need its own drift
      # check.
      - name: Check out the agent
        uses: actions/checkout@v5
        with:
          repository: ebpfsentinel/ebpfsentinel
          path: ebpfsentinel

      # The enterprise registry is the other half of the metric names, mounts
      # the other half of the REST surface, carries the HA peer service and
      # declares the licence binary's flags. That repository is private, so the
      # checkout needs a read token. The same checks run in the enterprise
      # pipeline as well, so a family renamed, a route regated, an rpc added or
      # a default changed there fails the change that caused it rather than the
      # next documentation branch anybody opens.
      - name: Check out the enterprise agent
        uses: actions/checkout@v5
        with:
          repository: ebpfsentinel/ebpfsentinel-enterprise
          path: ebpfsentinel-enterprise
          token: ${{ secrets.ENTERPRISE_READ_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check metric names
        working-directory: ebpfsentinel-docs
        run: npm run check:metrics

      - name: Check the REST reference
        working-directory: ebpfsentinel-docs
        run: npm run check:rest-routes

      # The API explorer renders a copy of the agent's document rather than
      # reading it, because the page is prerendered. A copy nobody compares
      # drifts, and this one had: three routes and a release behind.
      - name: Check the vendored OpenAPI document
        working-directory: ebpfsentinel-docs
        run: npm run check:vendored-openapi

      - name: Check the gRPC reference
        working-directory: ebpfsentinel-docs
        run: npm run check:grpc-reference

      - name: Check the CLI reference
        working-directory: ebpfsentinel-docs
        run: npm run check:cli-reference

      # The reference page is one page; a command is quoted on every page that
      # explains a feature. This walks all of them and holds each invocation to
      # the agent's own subcommand tree.
      - name: Check the documented CLI invocations
        working-directory: ebpfsentinel-docs
        run: npm run check:cli-invocations

      # Sixty-two mappings over twelve components. The page carries them
      # generated, so a mapping added to the agent fails here rather than
      # leaving the matrix a partial extract nobody notices is partial.
      - name: Check the ATT&CK coverage matrix
        working-directory: ebpfsentinel-docs
        run: npm run check:mitre-coverage

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The punctuation rule is a cross-repository invariant and was held here
      # by being read, so a hundred files had drifted. This reads the tracked
      # tree and needs no dependency, so it runs before the install rather than
      # after a build that would have passed anyway.
      - name: Check for typographic dashes
        run: npm run check:no-em-dash

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
