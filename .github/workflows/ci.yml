name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  metric-names:
    name: metric names match the two registries
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation
        uses: actions/checkout@v5
        with:
          path: ebpfsentinel-docs

      # The agent's registry is the source of truth for every series this tree
      # names. It is public, so the check reads it directly rather than
      # vendoring a copy that would need its own drift check.
      - name: Check out the agent
        uses: actions/checkout@v5
        with:
          repository: ebpfsentinel/ebpfsentinel
          path: ebpfsentinel

      # The enterprise registry is the other half, and this tree names every
      # series it exposes. That repository is private, so the checkout needs a
      # read token. The same check runs in the enterprise pipeline as well, so a
      # family renamed there fails the change that caused it rather than the
      # next documentation branch anybody opens.
      - name: Check out the enterprise agent
        uses: actions/checkout@v5
        with:
          repository: ebpfsentinel/ebpfsentinel-enterprise
          path: ebpfsentinel-enterprise
          token: ${{ secrets.ENTERPRISE_READ_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check metric names
        working-directory: ebpfsentinel-docs
        run: npm run check:metrics

  rest-routes:
    name: REST reference matches the mounted surface
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation
        uses: actions/checkout@v5
        with:
          path: ebpfsentinel-docs

      # `openapi.json` is generated from the agent's route annotations and its
      # own suite pins it to the mounted router both ways, so checking the page
      # against it is enough to catch a route that shipped undocumented.
      - name: Check out the agent
        uses: actions/checkout@v5
        with:
          repository: ebpfsentinel/ebpfsentinel
          path: ebpfsentinel

      # The enterprise document is the other half of the surface, and it carries
      # the role and the licence feature per operation as well as the path. That
      # repository is private, so the checkout needs a read token. The same check
      # runs in the enterprise pipeline, so a route added there fails the change
      # that caused it rather than the next documentation branch anybody opens.
      - name: Check out the enterprise agent
        uses: actions/checkout@v5
        with:
          repository: ebpfsentinel/ebpfsentinel-enterprise
          path: ebpfsentinel-enterprise
          token: ${{ secrets.ENTERPRISE_READ_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check REST routes
        working-directory: ebpfsentinel-docs
        run: npm run check:rest-routes

  grpc-reference:
    name: gRPC reference matches the proto
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation
        uses: actions/checkout@v5
        with:
          path: ebpfsentinel-docs

      # The message reference on the page is generated from these files, so a
      # field added to a proto without regenerating fails here rather than in an
      # integrator's generated client.
      - name: Check out the agent
        uses: actions/checkout@v5
        with:
          repository: ebpfsentinel/ebpfsentinel
          path: ebpfsentinel

      # The enterprise HA peer service is the other half of what speaks gRPC.
      # That repository is private, so the checkout needs a read token. The same
      # check runs in the enterprise pipeline, so an rpc added there fails the
      # change that caused it rather than the next documentation branch anybody
      # opens.
      - name: Check out the enterprise agent
        uses: actions/checkout@v5
        with:
          repository: ebpfsentinel/ebpfsentinel-enterprise
          path: ebpfsentinel-enterprise
          token: ${{ secrets.ENTERPRISE_READ_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the gRPC reference
        working-directory: ebpfsentinel-docs
        run: npm run check:grpc-reference

  cli-reference:
    name: CLI reference matches the enterprise binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation
        uses: actions/checkout@v5
        with:
          path: ebpfsentinel-docs

      # The three subcommands and every flag are read off the clap declarations
      # in the binary, so a fourth subcommand or a changed default fails here
      # rather than sending an operator to --help. That repository is private,
      # so the checkout needs a read token. The same check runs in the
      # enterprise pipeline, so a command added there fails the change that
      # caused it rather than the next documentation branch anybody opens.
      - name: Check out the enterprise agent
        uses: actions/checkout@v5
        with:
          repository: ebpfsentinel/ebpfsentinel-enterprise
          path: ebpfsentinel-enterprise
          token: ${{ secrets.ENTERPRISE_READ_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the CLI reference
        working-directory: ebpfsentinel-docs
        run: npm run check:cli-reference

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
