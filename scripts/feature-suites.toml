# The suites behind every page under docs/features/ (and the few pages outside
# it the website matrix links as a capability's page), read by
# check-feature-suites.mjs. One line per page, keyed by its path under docs/
# without the extension, exactly one of `suites` (oss/<name>, enterprise/<name>,
# operator/<lane>/<name>, dashboard/<path under crates/dashboard-server>),
# `reason` (a page that sells nothing a suite could run) or `gap` (sells
# something no suite runs yet). `gap_ceiling` is the number of gap lines.

